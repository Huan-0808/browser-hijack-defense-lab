<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ads.local - Trang Quảng Cáo Lạ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff3cd; color: #856404; text-align: center; padding: 40px; }
        .box { background: white; border: 2px solid #ffeeba; border-radius: 8px; padding: 30px; max-width: 650px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #d9534f; }
        .alert { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin: 20px 0; }
        .search-box { margin-top: 25px; }
        input[type="text"] { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>⚠️ CẢNH BÁO: BROWSER HIJACKED!</h1>
        <div class="alert">
            <strong>Trang chủ của máy trạm đã bị chuyển hướng sang http://ads.local:8080/</strong><br>
            Công cụ tìm kiếm mặc định bị đổi thành <em>AdsSearch</em>.
        </div>
        <p>Đây là dấu hiệu máy trạm bị cài đặt tiện ích mở rộng (Browser Extension) độc hại.</p>
        <div class="search-box">
            <input type="text" placeholder="Tìm kiếm với AdsSearch...">
            <button>Tìm kiếm</button>
        </div>
    </div>
</body>
</html>
